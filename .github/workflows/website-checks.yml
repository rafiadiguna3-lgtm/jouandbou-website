name: Website Checks

on:
  push:
    branches: [migration/jou-and-bou]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [migration/jou-and-bou]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      revision:
        description: 'Branch atau commit yang diperiksa. Gunakan branch pengembangan saat ini.'
        required: true
        default: migration/jou-and-bou
        type: string

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Build, assets, SEO and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.ref }}
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Record tested commit
        run: |
          echo "### Website Checks" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Checks only; Cloudflare deployment and the live Worker are separate." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify revision supports the current checks
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const p=JSON.parse(readFileSync('package.json')); if(!p.scripts?.['ci:source']||!p.scripts?.['ci:browser']) throw new Error('This revision does not include Website Checks. Select migration/jou-and-bou or a newer revision.');"

      - name: Install locked dependencies
        run: npm ci

      - name: Build and run source checks
        run: npm run ci:source

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Test browser flows
        run: npm run ci:browser

      - name: Save browser report and failure evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
